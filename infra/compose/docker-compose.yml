# Runs on vm-app. The three `api`/worker roles share one image
# (apps/api), selected by APP_ROLE — tech proposal §2. `api` is meant to
# run with 2 replicas behind Caddy's least_conn (tech proposal §11.1):
#   docker compose up -d --no-deps --wait --scale api=2 api web worker-media worker-general
#
# ${IMAGE_TAG} / ${GHCR_OWNER_REPO} are compose-file interpolation, read
# from a .env in THIS directory (infra/compose/.env) — not the same file
# as ../../.env below, which is decrypted secrets injected into
# containers via env_file:. The deploy workflow (.github/workflows/ci-cd.yml)
# writes both files on every deploy and rsyncs this directory from the
# repo at the deployed sha.
#
# Umami (product analytics, tech proposal §13) is not here: it needs its
# own database and Caddy route and is on the §16 cut list — see
# docs/tickets/007-umami.md.
#
# pgbouncer sits between api/worker-* and vm-db in transaction mode
# (tech proposal §11 / docs/tickets/001-vm-db-bootstrap.md) — Node
# connection pools plus workers would otherwise exhaust vm-db's
# max_connections=100. DATABASE_URL in ../../.env must point here
# (postgres://noizera:<password>@pgbouncer:6432/noizera), not at
# 10.0.0.20 directly; DB_PASSWORD in that same file is the password set
# via the db_app_password tofu var on vm-db. Image/env-var names for
# edoburu/pgbouncer are believed current but not verified against a real
# deploy yet — check Docker Hub before relying on this blindly.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  web:
    image: ghcr.io/${GHCR_OWNER_REPO}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    expose:
      - "3000"

  api:
    image: ghcr.io/${GHCR_OWNER_REPO}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      APP_ROLE: api
    expose:
      - "3000"
    # `docker compose up --wait` blocks on this, and Caddy's health_uri
    # polls the same endpoint — together they're the zero-downtime part.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_started
      pgbouncer:
        condition: service_started

  worker-media:
    image: ghcr.io/${GHCR_OWNER_REPO}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      APP_ROLE: worker-media
    cpus: 2
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  worker-general:
    image: ghcr.io/${GHCR_OWNER_REPO}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      APP_ROLE: worker-general
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    volumes:
      - valkey_data:/data

  pgbouncer:
    image: edoburu/pgbouncer:1.24.1
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DB_HOST: "10.0.0.20"
      DB_PORT: "5432"
      DB_NAME: "noizera"
      DB_USER: "noizera"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    expose:
      - "6432"

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  valkey_data:
