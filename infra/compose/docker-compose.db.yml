# Runs on vm-db. Postgres itself is installed on the host via cloud-init
# (see ../cloud-init/db.yaml), not containerized — this file exists only
# for pgBackRest's own tooling, which is straightforward to containerize
# even when Postgres isn't.

services:
  pgbackrest:
    image: pgbackrest/pgbackrest:latest
    restart: unless-stopped
    volumes:
      - /var/lib/postgresql/17/main:/var/lib/postgresql/data:ro
      - pgbackrest_repo:/var/lib/pgbackrest

volumes:
  pgbackrest_repo:
