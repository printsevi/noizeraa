name: Infra plan

# Tech proposal §11.3: "tofu plan on pull requests against infra/**,
# apply manual and gated. Never on push to main." This workflow only
# ever plans — see infra-apply.yml for the separate, manually-triggered
# apply workflow.

on:
  pull_request:
    paths:
      - "infra/tofu/**"
      - "infra/cloud-init/**" # consumed via templatefile() in servers.tf

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the plan as a PR comment
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      # State is committed SOPS-encrypted, not held in a remote backend
      # (tech proposal §11.3) — decrypt it into place before `tofu init`
      # if it exists yet (it won't on the very first plan ever run).
      - name: Install sops
        env:
          SOPS_VERSION: v3.9.1
          # From sops-<version>.checksums.txt on the release — update alongside the version.
          SOPS_SHA256: cd795109851c3a483bbaa66d15d19ddb2227ac0352b39e25d96b67d51edb6225
        run: |
          curl -sSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
          echo "${SOPS_SHA256}  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops
      - name: Decrypt state if present
        run: |
          if [ -f terraform.tfstate.enc ]; then
            umask 077
            printf '%s\n' "$SOPS_AGE_KEY" > /tmp/age-key.txt
            SOPS_AGE_KEY_FILE=/tmp/age-key.txt sops -d terraform.tfstate.enc > terraform.tfstate
          fi
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - id: plan
        run: tofu plan -no-color -input=false -out=tfplan | tee plan.txt
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_hetzner_s3_access_key: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          TF_VAR_hetzner_s3_secret_key: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_ip: ${{ secrets.ADMIN_IP }}
      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### `tofu plan` for `infra/`'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
