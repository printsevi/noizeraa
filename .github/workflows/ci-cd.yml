name: CI/CD

# Mirrors tech proposal §12: lint/typecheck/test on every push and PR;
# build + push images and deploy only on push to main, and only after
# every check job has passed. `workflow_dispatch` with a `sha` input
# redeploys a previously built image (rollback) without rebuilding.
#
# Actions are pinned to commit SHAs (the tag is kept in a comment for
# readability); update via Dependabot PRs, not by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of an already-pushed image to (re)deploy — rollback path"
        required: true

permissions: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # `pnpm lint` = eslint per package + dependency-cruiser boundary
      # rules (.dependency-cruiser.cjs). The latter needs built dist/
      # output to resolve workspace imports, hence the build first.
      - run: pnpm build --filter='./packages/*'
      - run: pnpm lint
      # Fails if the committed SQL under packages/infra/drizzle has
      # drifted from the schema (ticket 003) — `generate` is schema-only
      # and never touches a live database, unlike `push`.
      - run: pnpm --filter @noizera/infra db:generate
      - run: git diff --exit-code -- packages/infra/drizzle
      - run: |
          if [ -n "$(git status --porcelain -- packages/infra/drizzle)" ]; then
            echo "drizzle-kit generate produced an uncommitted migration — commit it." >&2
            git status --porcelain -- packages/infra/drizzle >&2
            exit 1
          fi

  typecheck:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration tests use Testcontainers (real Postgres/RabbitMQ),
      # which talks to the Docker daemon already available on this
      # runner — no `services:` block needed (tech proposal §1).
      - run: pnpm build
      - run: pnpm test

  e2e:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter='./packages/*'
      - run: pnpm --filter @noizera/web exec playwright install --with-deps chromium
      - run: pnpm --filter @noizera/web test:e2e

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }},ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }},ghcr.io/${{ github.repository }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs after build-and-push on main, or standalone from
  # workflow_dispatch with a previously built `sha` (rollback).
  #
  # Reaches vm-app over Tailscale (ADR 001): the runner joins the tailnet
  # as an ephemeral node tagged `tag:ci`; the tailnet ACL allows
  # tag:ci → tag:server:22 only. Public port 22 stays restricted to
  # `admin_ip` as break-glass and is never opened to GitHub's IP ranges.
  #
  # Still requires, on the host: /opt/noizera/infra/compose/.env.enc and
  # the sops age key at /opt/noizera/age.key (provisioned once by hand),
  # and apps/api shipping dist/migrate.js (docs/tickets/003).
  deploy:
    # On workflow_dispatch build-and-push is skipped, which would skip
    # this job too by default — hence `!cancelled()` plus an explicit
    # check that the build either succeeded or was skipped (never failed).
    if: |
      !cancelled() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event.inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      # Compose and Caddy config come from the repo at the deployed sha
      # — the host never holds a git checkout, just these files.
      - name: Sync infra/compose to vm-app
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_APP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete \
            --exclude '.env' --exclude '.env.enc' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            infra/compose/ \
            "${{ secrets.VM_APP_SSH_USER }}@${{ secrets.VM_APP_TAILSCALE_HOST }}:/opt/noizera/infra/compose/"
      - name: Deploy to vm-app
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VM_APP_TAILSCALE_HOST }}
          username: ${{ secrets.VM_APP_SSH_USER }}
          key: ${{ secrets.VM_APP_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/noizera/infra/compose
            # docker compose reads ${VAR} interpolation in the compose
            # file itself from a .env in this directory (distinct from
            # the env_file: directive, which only sets container env) —
            # so both go here, not into the repo-root .env.
            printf 'IMAGE_TAG=%s\nGHCR_OWNER_REPO=%s\n' \
              "${{ env.DEPLOY_SHA }}" "${{ github.repository }}" > .env
            SOPS_AGE_KEY_FILE=/opt/noizera/age.key sops -d .env.enc > ../../.env
            docker compose pull
            docker compose run --rm api node dist/migrate.js
            docker compose up -d --no-deps --wait --scale api=2 api web worker-media worker-general
